steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node.js 22
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install Project Dependencies
    run: npm install --legacy-peer-deps

  - name: Build Web Production Bundle
    run: npm run build

  - name: Setup Java JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Capacitor Core & Android Platform
    run: |
      npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
      npx cap init "SKdrama" "com.skdrama.app" --web-dir dist
      npx cap add android
      npx cap sync android

  - name: Build APK via Gradle
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug --stacktrace

  - name: Upload SKdrama APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: SKdrama-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30
